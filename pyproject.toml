[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus-privacy-intelligence"
version = "0.1.0"
description = "Privacy-aware classification and topic mining for large text corpora"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Surya Vaddhiparthy" }
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
nlp = [
  "presidio-analyzer>=2.2.355",
  "spacy>=3.7",
  "scikit-learn>=1.4",
]
embeddings = ["sentence-transformers>=3.0"]
all = [
  "presidio-analyzer>=2.2.355",
  "spacy>=3.7",
  "scikit-learn>=1.4",
  "sentence-transformers>=3.0",
]

[project.scripts]
corpus-privacy-intelligence = "corpus_privacy_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Without this a clean clone fails with ModuleNotFoundError, even though the README
# tells the reader to run `python -m pytest -q`.
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# These files are dominated by regex alternation banks and a verbatim LLM prompt.
# Wrapping either would obscure the pattern or change the prompt text, so line length
# is not enforced there. Everything else in the project is.
"src/corpus_privacy_intelligence/advanced_detectors.py" = ["E501"]
"src/corpus_privacy_intelligence/validators.py" = ["E501"]
"src/corpus_privacy_intelligence/ollama_validation.py" = ["E501"]
